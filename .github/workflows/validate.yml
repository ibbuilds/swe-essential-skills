name: Validate skill structure
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platform_checks:
    name: Platform validation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests
      - run: python scripts/validate_skills.py

  # Preserve the existing validate check name while requiring both platforms here.
  validate:
    needs: platform_checks
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every platform to pass
        env:
          PLATFORM_RESULT: ${{ needs.platform_checks.result }}
        run: test "$PLATFORM_RESULT" = success
